<!DOCTYPE html>
<html lang="es">
<head>
  <title>Quinto Ejercicio</title>
</head>
<body>
    <script>
        // .trim() elimina los espacios antes y después del texto escrito
        var nombreMarcaPC = prompt("Nombre de la marca del PC: ").trim().toUpperCase();
        var modeloPC = prompt("Modelo del PC: ").trim().toUpperCase();

        var precioPC = 1000;

        if (nombreMarcaPC === "MSI" && modeloPC === "PRESTIGE"){
            document.write("Tienes descuento del 5%, precio final: " + (precioPC * 0.95));
        }
        else if (nombreMarcaPC === "HP" && modeloPC === "PAVILION") {
            document.write("Tienes descuento del 10%, precio final: " + (precioPC * 0.90));
        }
        else {
            document.write("No hay descuento, precio final: " + precioPC);
        }
    </script>

</body>
</html>
