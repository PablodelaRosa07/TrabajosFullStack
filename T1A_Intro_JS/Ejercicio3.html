<!DOCTYPE html>
<html lang="es">
<head>
  <title>Tercer Ejercicio</title>
</head>
<body>

    <script>
        var numero1 = parseInt(prompt("Numero 1: "));
        var numero2 = parseInt(prompt("Numero 2: "));
        
        if (numero2 == 0){
            document.write("No se puede dividir entre cero")
        }
        else {
            document.write("La suma es: " +(numero1+numero2)+ ". La resta es: " +(numero1-numero2)+ ". La multiplicación es: " +(numero1*numero2)+ ". La división es: " +(numero1/numero2));
        }

    </script>

</body>
</html>
