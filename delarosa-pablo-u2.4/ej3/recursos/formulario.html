<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libro de visitas</title>
</head>
<body>
  <h1>Libro de visitas</h1>
  <form method="POST" action="/firmar">
    <p>
      <label>Nombre:<br>
        <input name="nombre">
      </label>
    </p>
    <p>
      <label>Mensaje (máx. 200 caracteres):<br>
        <textarea name="mensaje" rows="4" cols="40"></textarea>
      </label>
    </p>
    <button type="submit">Firmar</button>
  </form>
  <p><a href="/firmas">Ver todas las firmas (JSON)</a></p>
</body>
</html>
